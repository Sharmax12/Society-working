<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="heroGradientSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
  </defs>

  <!-- Background soft circle -->
  <circle cx="300" cy="300" r="260" fill="url(#heroGradientSoft)" opacity="0.12"/>
  <circle cx="300" cy="300" r="200" fill="none" stroke="url(#heroGradientSoft)" stroke-width="1.5" opacity="0.35" stroke-dasharray="4 8"/>

  <!-- Connecting lines between outer nodes and center hub -->
  <g stroke="url(#heroGradient)" stroke-width="2.5" opacity="0.55">
    <line x1="300" y1="300" x2="180" y2="160"/>
    <line x1="300" y1="300" x2="420" y2="160"/>
    <line x1="300" y1="300" x2="460" y2="300"/>
    <line x1="300" y1="300" x2="420" y2="440"/>
    <line x1="300" y1="300" x2="180" y2="440"/>
    <line x1="300" y1="300" x2="140" y2="300"/>
  </g>

  <!-- Outer person nodes (simple people icons: circle head + rounded body) -->
  <g fill="url(#heroGradient)">
    <!-- Node 1 -->
    <circle cx="180" cy="140" r="20"/>
    <path d="M180 168 a34 34 0 0 1 34 34 h-68 a34 34 0 0 1 34 -34 z" />

    <!-- Node 2 -->
    <circle cx="420" cy="140" r="20"/>
    <path d="M420 168 a34 34 0 0 1 34 34 h-68 a34 34 0 0 1 34 -34 z" />

    <!-- Node 3 -->
    <circle cx="480" cy="300" r="20"/>
    <path d="M480 328 a34 34 0 0 1 34 34 h-68 a34 34 0 0 1 34 -34 z" />

    <!-- Node 4 -->
    <circle cx="420" cy="460" r="20"/>
    <path d="M420 488 a34 34 0 0 1 34 34 h-68 a34 34 0 0 1 34 -34 z" />

    <!-- Node 5 -->
    <circle cx="180" cy="460" r="20"/>
    <path d="M180 488 a34 34 0 0 1 34 34 h-68 a34 34 0 0 1 34 -34 z" />

    <!-- Node 6 -->
    <circle cx="120" cy="300" r="20"/>
    <path d="M120 328 a34 34 0 0 1 34 34 h-68 a34 34 0 0 1 34 -34 z" />
  </g>

  <!-- Center hub: larger circle representing "your society/community" -->
  <circle cx="300" cy="300" r="56" fill="url(#heroGradient)"/>
  <circle cx="300" cy="282" r="18" fill="white" opacity="0.95"/>
  <path d="M300 306 a30 30 0 0 1 30 30 h-60 a30 30 0 0 1 30 -30 z" fill="white" opacity="0.95"/>
</svg>
