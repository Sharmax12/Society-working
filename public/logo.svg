<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ccGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Outer ring representing the "circle" of a community -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#ccGradient)" stroke-width="10"/>

  <!-- Three connected nodes forming a small triangle inside, representing people/societies linked together -->
  <circle cx="100" cy="58" r="14" fill="url(#ccGradient)"/>
  <circle cx="66" cy="128" r="14" fill="url(#ccGradient)"/>
  <circle cx="134" cy="128" r="14" fill="url(#ccGradient)"/>

  <!-- Connecting lines -->
  <line x1="100" y1="58" x2="66" y2="128" stroke="url(#ccGradient)" stroke-width="6" stroke-linecap="round"/>
  <line x1="100" y1="58" x2="134" y2="128" stroke="url(#ccGradient)" stroke-width="6" stroke-linecap="round"/>
  <line x1="66" y1="128" x2="134" y2="128" stroke="url(#ccGradient)" stroke-width="6" stroke-linecap="round"/>
</svg>
