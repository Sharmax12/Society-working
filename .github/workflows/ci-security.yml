name: CI and security checks

on:
  pull_request:
  push:
    branches: [main, "security/**"]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/hwl_ci
          AUTH_SECRET: ci-only-not-a-real-secret
          AUTH_GOOGLE_ID: ci-only.apps.googleusercontent.com
          AUTH_GOOGLE_SECRET: ci-only
          COLLEGE_EMAIL_DOMAINS: nsut.ac.in
          NEXT_PUBLIC_APP_URL: https://www.hallwayloop.com
