name: Dependency remediation preview

on:
  push:
    branches:
      - "security/hwl-audit-hardening"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile and apply compatible security updates
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only || true
      - name: Generate compact lockfile change set
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const original = JSON.parse(execFileSync("git", ["show", "HEAD:package-lock.json"], { encoding: "utf8" }));
          const patched = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const keys = new Set([...Object.keys(original.packages), ...Object.keys(patched.packages)]);
          const changes = {};
          for (const key of keys) {
            if (JSON.stringify(original.packages[key]) !== JSON.stringify(patched.packages[key])) {
              changes[key] = patched.packages[key] ?? null;
            }
          }
          const deltas = {};
          for (const [key, value] of Object.entries(changes)) {
            const before = original.packages[key];
            if (value === null) {
              deltas[key] = null;
            } else if (before === undefined) {
              deltas[key] = { __replace: value };
            } else {
              const merge = {};
              const remove = [];
              for (const field of new Set([...Object.keys(before), ...Object.keys(value)])) {
                if (JSON.stringify(before[field]) === JSON.stringify(value[field])) continue;
                if (Object.prototype.hasOwnProperty.call(value, field)) merge[field] = value[field];
                else remove.push(field);
              }
              deltas[key] = { __merge: merge, __remove: remove };
            }
          }
          fs.writeFileSync("lockfile-deltas.json", JSON.stringify({ lockfileVersion: patched.lockfileVersion, changes: deltas }));
          console.log(`Changed lock entries: ${Object.keys(deltas).length}; bytes: ${fs.statSync("lockfile-deltas.json").size}`);
          NODE
      - name: Produce reviewable dependency diff
        run: |
          git diff -- package.json package-lock.json > dependency-remediation.patch
          npm audit --json > npm-audit.json || true
      - name: Upload dependency patch for review
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-preview
          path: |
            package.json
            package-lock.json
            dependency-remediation.patch
            lockfile-changes.json
            lockfile-deltas.json
            npm-audit.json
          if-no-files-found: error
          retention-days: 2
